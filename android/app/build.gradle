plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

def metadata = new groovy.json.JsonSlurper().parse(file('../../desktop/version.json'))
def versionParts = metadata.version.tokenize('.').collect { it as int }
android {
    namespace 'io.github.xiaofan6ya.workbuddy2api'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'io.github.xiaofan6ya.workbuddy2api'
        minSdk 24
        targetSdk 35
        versionCode versionParts[0] * 1000000 + versionParts[1] * 1000 + versionParts[2]
        versionName metadata.version
        ndk { abiFilters 'arm64-v8a' }
    }
    if (System.getenv('WB_ANDROID_KEYSTORE')) {
        // 签名身份由 scripts/android_signing.py 统一管理（一次生成、长期复用）：
        // keystore / 密码 / 别名全部从环境变量注入，别名不再写死 ——
        // 写死时一旦脚本换了别名，gradle 会拿「别名不存在」的 keystore
        // 签出一个空签名包，装上去直接 INSTALL_PARSE_FAILED_NO_CERTIFICATES。
        signingConfigs {
            release {
                storeFile file(System.getenv('WB_ANDROID_KEYSTORE'))
                storePassword System.getenv('WB_ANDROID_STORE_PASSWORD')
                keyAlias (System.getenv('WB_ANDROID_KEY_ALIAS') ?: 'workbuddy2api')
                keyPassword System.getenv('WB_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug' }
        release {
            minifyEnabled false
            if (System.getenv('WB_ANDROID_KEYSTORE')) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

chaquopy {
    defaultConfig {
        version '3.10'
        if (System.getenv('WB_ANDROID_BUILD_PYTHON')) buildPython System.getenv('WB_ANDROID_BUILD_PYTHON')
        pip {
            install '-r', rootProject.file('requirements.txt').absolutePath
            options '--index-url', 'https://pypi.tuna.tsinghua.edu.cn/simple'
            options '--extra-index-url', 'https://chaquo.com/pypi-13.1'
        }
    }
    sourceSets {
        main { srcDir layout.buildDirectory.dir('generated/python').get().asFile }
    }
}

def preparePython = tasks.register('preparePython', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine (System.getenv('WB_ANDROID_BUILD_PYTHON') ?: 'python'), 'scripts/build_android.py', '--prepare-only'
}
tasks.configureEach {
    // Chaquopy snapshots sources during merge, before its generate tasks run.
    // Staging only before generate can package the previous build's backend.
    if ((name.startsWith('generate') && name.contains('Python')) ||
            (name.startsWith('merge') && name.endsWith('PythonSources'))) dependsOn preparePython
}
